# Concourse pipeline — build the Windows installer for the-one and publish it to
# the local minio (S3) bucket. Lives in the `the-one` Concourse team.
#
# Set / update with:
#   fly -t the-one set-pipeline -p windows-installer -c ci/windows-installer.pipeline.yml
#
# Secrets are resolved from Vault (concourse/the-one/windows-installer/*):
#   - github-deploy-key.private_key  (read-only deploy key for this repo)
#   - minio.access_key / minio.secret_key
# No credentials live in this file.
#
# The `repo` git resource POLLS GitHub (the Concourse web node is localhost-only, so
# webhook push is not possible) and the build job auto-triggers on each new commit to
# the tracked branch — effective "rebuild on push" within the poll interval.
#
# NOTE: `branch` tracks the packaging work. Point it at `main` once the Windows
# packaging lands there; until then it tracks the flight branch that carries
# packaging/windows/* and ci/tasks/windows-installer-build.yml.

resources:
  - name: repo
    type: git
    icon: github
    source:
      uri: git@github.com:msieurthenardier/the-one.git
      branch: flight/05-packaging-installer-windows
      private_key: ((github-deploy-key.private_key))

  - name: installer
    type: s3
    icon: package-variant-closed
    source:
      endpoint: minio:9000
      disable_ssl: true
      region_name: us-east-1
      bucket: the-one-installers
      regexp: the-one-setup-(.*)\.exe
      access_key_id: ((minio.access_key))
      secret_access_key: ((minio.secret_key))

jobs:
  - name: build-windows-installer
    plan:
      - get: repo
        trigger: true
      - task: build
        file: repo/ci/tasks/windows-installer-build.yml
      - put: installer
        params:
          file: installer/the-one-setup-*.exe
