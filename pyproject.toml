[project]
name = "the-one"
version = "0.1.0"
description = "A personal agentic system — LLM-agnostic, tool-rich, monolithic."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    "cryptography>=43.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
all-llms = ["openai>=1.0", "anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
the-one = "the_one.main:cli_entry"

[tool.setuptools.packages.find]
include = ["the_one*"]

[tool.setuptools.package-data]
the_one = ["interfaces/web/static/**/*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: marks tests that call real LLM APIs (deselect with '-m \"not live\"')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
