jobs:
  - name: deploy
    plan:
      - task: test
        privileged: true
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: docker, tag: 25.0.3-cli }
          params:
            DOCKER_HOST: ((docker-host))
            WORKSPACE_PATH: ((workspace-path))
            THE_ONE_DEV_MODE: "true"
          run:
            path: sh
            args:
              - -exc
              - |
                docker run --rm \
                  -e THE_ONE_DEV_MODE="${THE_ONE_DEV_MODE}" \
                  -v "${WORKSPACE_PATH}:/src:ro" \
                  mcr.microsoft.com/playwright/python:v1.58.0-jammy \
                  sh -c "cp -r /src /work && cd /work && pip install --no-cache-dir '.[dev]' -q && ruff check the_one/ tests/ && ruff format --check the_one/ tests/ && python -m pytest tests/ --tb=short -q && python -m pytest -m browser tests/browser/ --tb=short -q"

      - task: build-and-deploy
        privileged: true
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: docker, tag: 25.0.3-cli }
          params:
            DOCKER_HOST: ((docker-host))
            WORKSPACE_PATH: ((workspace-path))
          run:
            path: sh
            args:
              - -exc
              - |
                docker tag the-one:latest the-one:rollback 2>/dev/null || true

                # Build: run docker build inside a container that has host source access
                docker run --rm \
                  -v "${WORKSPACE_PATH}:/src" \
                  -v /var/run/docker.sock:/var/run/docker.sock \
                  -w /src \
                  docker:25.0.3-cli \
                  docker build -t the-one:latest .

                # Deploy: run deploy.sh from the host workspace via docker
                docker run --rm \
                  -v "${WORKSPACE_PATH}:/src:ro" \
                  -v /var/run/docker.sock:/var/run/docker.sock \
                  docker:25.0.3-cli \
                  sh /src/ci/deploy.sh latest

      - task: health-check
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: curlimages/curl, tag: 8.6.0 }
          params:
            APP_URL: ((app-url))
          run:
            path: sh
            args:
              - -exc
              - |
                # Wait for the app to come up
                echo "Waiting for app to start..."
                up=false
                for i in $(seq 1 12); do
                  if curl -sf "${APP_URL}/api/info" > /dev/null 2>&1; then
                    echo "App is up after attempt $i"
                    up=true
                    break
                  fi
                  echo "Attempt $i/12 — not ready, waiting 5s..."
                  sleep 5
                done
                if [ "$up" != "true" ]; then
                  echo "ERROR: app never came up after 60s. Pipeline failing fast."
                  exit 1
                fi

                # Run selftest (LLM + tool smoke test)
                echo "Running selftest..."
                result=$(curl -sf --max-time 120 "${APP_URL}/api/selftest" 2>&1) || {
                  echo "SELFTEST FAILED — triggering rollback"
                  echo "$result"
                  exit 1
                }
                echo "Selftest passed: $result"

    on_failure:
      do:
        - task: auto-rollback
          privileged: true
          config:
            platform: linux
            image_resource:
              type: registry-image
              source: { repository: docker, tag: 25.0.3-cli }
            params:
              DOCKER_HOST: ((docker-host))
              WORKSPACE_PATH: ((workspace-path))
            run:
              path: sh
              args:
                - -exc
                - |
                  docker run --rm \
                    -v "${WORKSPACE_PATH}:/src:ro" \
                    -v /var/run/docker.sock:/var/run/docker.sock \
                    docker:25.0.3-cli \
                    sh /src/ci/deploy.sh rollback
                  echo "Rolled back to previous image"
