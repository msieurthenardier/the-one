name: pr-lint

# Fast pre-merge gate on pull requests targeting main: ruff (check + format) + a
# release-closure pip-audit. Routine full test/browser/windows/bwrap lanes stay on
# local Concourse (post-merge on main, M15 F8 cost-shift) — this workflow does
# NOT re-enable them on PR triggers; see ci/README.md for the full lane map.
#
# pip-audit here is a DELIBERATE POLICY CHANGE from `make audit`
# (Makefile:229-231, `pip-audit --skip-editable || true`, warn-only): this job
# FAILS the build on a release-closure finding. It audits `uv export --no-dev
# --no-emit-project --extra gui --extra all-llms` (the closure the Windows
# installer ships — no dev/toolchain deps, no editable self-entry) so it
# doesn't get red on dev-only findings (e.g. msgpack via pip-audit's own
# cachecontrol dep, or the pip toolchain itself) that carry no shipped risk.
# It only re-reddens when a new CVE appears in the release closure — the
# intended signal (Flight 01 Leg 02, maintenance report 2026-07-10 finding
# C4; extras added 2026-07-28 after gui-only pillow advisories slipped past
# the base-runtime-only export).
#
# Triggers (squawk 0107): pull_request (both jobs), a weekly schedule and
# workflow_dispatch (pip-audit only, so new advisories against unchanged pins
# surface between releases instead of blocking the release PR). A scheduled
# failure is visible as GitHub's failed-workflow notification to the user who
# last edited the cron line; GitHub disables scheduled workflows after 60 days
# with no repository activity (see ci/README.md).
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC, runs on the default branch
  workflow_dispatch:

concurrency:
  group: pr-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.15
      - name: Ruff check
        run: ruff check the_one/ tests/ scripts/ evals/
      - name: Ruff format check
        run: ruff format --check the_one/ tests/ scripts/ evals/

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install pip-audit
        # Quoted — unquoted, bash parses `>=2.7` as a redirect and installs
        # pip-audit unpinned while writing stdout to a stray file named `=2.7`.
        run: pip install "pip-audit>=2.7"
      - name: Export release dependency closure (runtime + installer extras)
        # --extra gui --extra all-llms: audit the closure the Windows
        # installer actually ships (packaging/windows/build.ps1 installs
        # this locked closure), not just the base runtime deps — pillow's
        # 2026-07-28 advisories were invisible to the base-only export
        # because pillow then entered only via the gui extra (it is a base
        # dependency since M35 F3 L1, and this export still covers it).
        run: uv export --no-dev --no-emit-project --extra gui --extra all-llms --format requirements-txt > release-requirements.txt
      - name: pip-audit (release closure — fails on findings)
        # --disable-pip: audit the pinned+hashed export exactly as written,
        # no resolver/dry-run install. Required here because the gui extra's
        # linux marker pulls pycairo (via pywebview[gtk]), whose metadata
        # build needs system cairo/pkg-config the runner doesn't have — and
        # the linux gtk chain isn't part of the shipped artifact anyway.
        # Exit semantics verified: 1 on findings, 0 clean.
        run: pip-audit --disable-pip -r release-requirements.txt
