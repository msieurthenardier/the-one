[project]
name = "the-one"
version = "0.5.0"
description = "A personal agentic system — LLM-agnostic, tool-rich, monolithic."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # readability-lxml + markdownify: runtime feature deps consumed by
    # FetchUrlTool (the_one/tools/web.py) when fetching text/html. Keep
    # in base dependencies — moving to [dev] would re-open the host-env
    # gap that Flight 01 Leg 01 surfaced (and commit e65077e closed).
    "readability-lxml>=0.8",
    "markdownify>=0.13",
    "pydantic>=2.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    # M10 mission constraint: "Wire-protocol clients use maintained SDKs
    # with pinned versions" — F8 L2 pins discord.py (the Discord gateway
    # SDK used by DiscordPlugin in F8 L3+). Bound to 2.4.x to lock the
    # connector's surface against accidental major-version SDK upgrades.
    "discord.py>=2.4,<2.5",
    # 1.28.1 closes PYSEC-2026-3481/3482/3483 (2026-07-28 pr-lint pip-audit
    # run; 1.27.2 fixed only 3481/3482 — 3483 needed 1.28.1).
    "mcp==1.28.1",
    # CVE floors (deps — some direct, most transitive — promoted to
    # explicit floors so any resolve that starts from these ranges instead
    # of uv.lock, e.g. `pip install -e ".[gui,all-llms]"` in
    # .github/workflows/windows-installer.yml, still lands on the fixed
    # versions, not just uv.lock's pins). Each line cites the version that
    # fixed the CVE, verified against the advisory:
    #  - aiohttp via discord.py (closes PYSEC-2026-237, CVE-2026-54273,
    #    CVE-2026-54274, CVE-2026-54276, CVE-2026-54277, CVE-2026-54278,
    #    CVE-2026-54279, CVE-2026-54280 — 2026-07-10 pip-audit run)
    #  - idna via httpx/anyio/requests (closes CVE-2026-45409)
    #  - starlette via fastapi/mcp/sse-starlette (closes PYSEC-2026-248,
    #    PYSEC-2026-249 — same run)
    #  - cryptography, direct dep (closes GHSA-537c-gmf6-5ccf, a
    #    statically-linked vulnerable OpenSSL; fixed in 48.0.1)
    #  - pydantic-settings, direct dep (closes GHSA-4xgf-cpjx-pc3j,
    #    CVE-2026-58203, symlink escape in NestedSecretsSettingsSource;
    #    fixed in 2.14.2)
    #  - python-multipart, pure transitive via fastapi/starlette upload
    #    parsing (no prior explicit floor; closes GHSA-5rvq-cxj2-64vf /
    #    CVE-2026-53539 and GHSA-v9pg-7xvm-68hf / CVE-2026-53540; fixed in
    #    0.0.31)
    #  - soupsieve, pure transitive via readability-lxml's bs4 dep (no
    #    prior explicit floor; closes GHSA-2wc2-fm75-p42x /
    #    CVE-2026-49476 and GHSA-836r-79rf-4m37 / CVE-2026-49477; fixed in
    #    2.8.4)
    #  - lxml-html-clean, pure transitive via readability-lxml (no prior
    #    explicit floor; closes GHSA-4jhm-jv67-739f / CVE-2026-49825,
    #    xlink:href javascript: URL bypass; fixed in 0.4.5)
    #  - lxml is not itself CVE-affected here; floor is forced by the
    #    lxml-html-clean>=0.4.5 requirement above (lxml-html-clean 0.4.5
    #    requires lxml>=6.1.1) — a dependency-of-the-pin floor, not an
    #    independent CVE fix.
    #  - click, pure transitive via uvicorn/mcp (no prior explicit floor;
    #    closes PYSEC-2026-2132; fixed in 8.3.3 — 2026-07-28 pr-lint
    #    pip-audit run)
    "aiohttp>=3.14.1",
    "click>=8.3.3",
    "idna>=3.15",
    "starlette>=1.3.1",
    "cryptography>=48.0.1",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "soupsieve>=2.8.4",
    "lxml-html-clean>=0.4.5",
    "lxml>=6.1.1",
    "platformdirs>=4.0",
    # ConPTY backend for Windows PTY sessions (M15 F3 Leg 2). The env marker
    # ensures this never installs on Linux/macOS — pywinpty is Windows-only.
    "pywinpty>=2.0; sys_platform == \"win32\"",
]

[project.optional-dependencies]
# openai>=2.16 floor: openrouter_provider's no-leak invariant
# (the_one/llm/openrouter_provider.py:21-32) depends on the SDK
# rejecting api_key="" at construction time, which became the public
# behaviour in openai 2.16. Earlier versions accept the empty string and
# silently fall back to OPENAI_API_KEY, defeating the no-leak guard.
openai = ["openai>=2.16"]
anthropic = ["anthropic>=0.40"]
all-llms = ["openai>=2.16", "anthropic>=0.40"]
gui = [
    "pywebview[gtk]>=5,<6; sys_platform == 'linux'",
    "pywebview>=5,<6; sys_platform != 'linux'",
    "pystray>=0.19",
    # pillow>=12.3 floor: closes PYSEC-2026-2253..2257, PYSEC-2026-3451..3454,
    # PYSEC-2026-3493..3496 (all fixed in 12.3.0 — 2026-07-28 full-venv
    # pip-audit). The gui extra ships in the Windows installer
    # (.github/workflows/windows-installer.yml re-resolves from these
    # ranges), so this floor must bind there — same dual-binding rule as
    # the runtime CVE-floor block above.
    "pillow>=12.3",
]
# urllib3 floor is a toolchain-only CVE fix (reaches the tree solely via
# requests, pulled by dev/test tooling — pip-audit/cachecontrol/pytest-base-url;
# NOT in the runtime closure). Closes PYSEC-2026-142, PYSEC-2026-141.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-timeout>=2.4", "ruff==0.15.15", "pre-commit>=3", "playwright==1.58.0", "pytest-playwright>=0.5", "pillow>=12.3", "pixelmatch>=0.3", "asgi-lifespan>=2.0", "pip-audit>=2.7", "urllib3>=2.7.0"]

[project.scripts]
the-one = "the_one.main:cli_entry"

[tool.setuptools.packages.find]
include = ["the_one*"]

[tool.setuptools.package-data]
the_one = ["interfaces/web/static/**/*", "llm/data/*.json"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib import-mode + explicit pythonpath: required so the existing
# `from conftest import FakeLLM, StubTool` pattern in tests/test_*.py keeps
# resolving to tests/conftest.py once tests/browser/conftest.py exists.
# Without this, pytest's default rootdir-prepend caches the nested browser
# conftest in sys.modules under the bare name "conftest" and shadows the
# top-level fixtures module.
# Per-marker deselect math (last verified L4 F2): live=15, browser=513, pixel=12, requires_bwrap=12, discord_hat=5, total=557
addopts = "-m 'not live and not browser and not pixel and not requires_bwrap and not discord_hat' --import-mode=importlib"
pythonpath = ["tests"]
markers = [
    "live: marks tests that call real LLM APIs (deselect with '-m \"not live\"')",
    "browser: marks tests that require a browser via Playwright (deselect with '-m \"not browser\"')",
    "pixel: marks visual-regression snapshot tests (local-only; baselines are gitignored). Run with '-m pixel'; regenerate with '-m pixel --snapshot-update'. Excluded from CI.",
    "requires_bwrap: marks tests that need a real bwrap binary in $PATH (deselect with '-m \"not requires_bwrap\"')",
    "discord_hat: live multi-bot Discord HAT (needs bot tokens + a test guild; deselect by default)",
]
norecursedirs = ["workspace", ".worktrees", "node_modules", ".git"]


[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["workspace"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
