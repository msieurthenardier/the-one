---
# Browser test suite — mirrors the GitHub Actions "browser" job (test.yml).
# Runs Playwright-driven browser tests with a mock LLM provider.
# `playwright install --with-deps chromium` runs as root in the debian python:3.11
# image — apt deps are installed automatically by --with-deps.
# Bare `python -m pytest` is correct here (Concourse task containers are ephemeral —
# orphaned uvicorn/Chromium children die with the container).
# Expected wall-clock: ~15 min (the CI long pole).
# Runnable two ways:
#   fly -t the-one execute -c ci/tasks/browser.yml -i repo=.   (local tree)
#   as a task in ci/the-one.pipeline.yml                               (git resource)
platform: linux

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.11"

inputs:
  - name: repo

run:
  path: bash
  args:
    - -ceu
    - |
      cd repo
      pip install -e ".[all-llms,dev]"
      python -m playwright install --with-deps chromium
      THE_ONE_DEV_MODE=true python -m pytest -m browser tests/browser/ --timeout=300 --tb=short
