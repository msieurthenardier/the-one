# GleepGlorp, tool-capable, web access on (memory off, so the notes layer is not counted).
# The harness disables web_search (no engine in the scratch app), so the starting tools are
# current_time, read_app_config, get_app_guide, propose_change (M36 F2: the factory puts every
# GleepGlorp tool except search_tools in the starting set) and fetch_url. Defined once here.
id = "measure-gg-tools-web-on"
class = "hold"
description = "GleepGlorp: tool-capable prompt, web access on."

[agent]
builder = "gleepglorp"
web_access = true

[[conversations]]
turns = ["Hello."]

[[checks]]
name = "date_line_present"
