jobs:
  - name: deploy
    plan:
      - task: test
        privileged: true
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: docker, tag: cli }
          params:
            DOCKER_HOST: ((docker-host))
          run:
            path: sh
            args:
              - -exc
              - |
                docker run --rm \
                  -v /home/cprch/projects/the-one:/src:ro \
                  -w /src \
                  python:3.11-slim \
                  sh -c "pip install --no-cache-dir '.[dev]' -q && python -m compileall -q the_one/ && python -m pytest tests/ --tb=short -q || true"

      - task: build-and-deploy
        privileged: true
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: docker, tag: cli }
          params:
            DOCKER_HOST: ((docker-host))
          run:
            path: sh
            args:
              - -exc
              - |
                docker tag the-one:latest the-one:rollback 2>/dev/null || true

                # Build: run docker build inside a container that has host source access
                docker run --rm \
                  -v /home/cprch/projects/the-one:/src \
                  -v /var/run/docker.sock:/var/run/docker.sock \
                  -w /src \
                  docker:cli \
                  docker build -t the-one:latest .

                # Deploy: stop old container, start new one
                docker rm -f the-one 2>/dev/null || true
                docker run -d \
                  --name the-one \
                  --restart unless-stopped \
                  -p 8484:8484 \
                  -v /home/cprch/projects/the-one:/workspace \
                  -e THE_ONE_LLM_PROVIDER=ollama \
                  -e THE_ONE_LLM_MODEL=qwen2.5:7b \
                  -e THE_ONE_LLM_BASE_URL=http://host.docker.internal:11434/v1 \
                  -e THE_ONE_HOST=0.0.0.0 \
                  -e THE_ONE_WORKSPACE_DIR=/workspace \
                  -e THE_ONE_CONCOURSE_TARGET=local \
                  -e THE_ONE_CONCOURSE_PIPELINE=the-one \
                  -e THE_ONE_CONCOURSE_URL=http://host.docker.internal:8080 \
                  -e THE_ONE_CONCOURSE_USER=the-one \
                  -e THE_ONE_CONCOURSE_PASS=((concourse-pass)) \
                  -e THE_ONE_CONCOURSE_TEAM=the-one \
                  --add-host host.docker.internal:host-gateway \
                  the-one:latest

      - task: health-check
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: curlimages/curl, tag: latest }
          params:
            APP_URL: ((app-url))
          run:
            path: sh
            args:
              - -exc
              - |
                # Wait for the app to come up
                echo "Waiting for app to start..."
                for i in $(seq 1 12); do
                  if curl -sf "${APP_URL}/api/info" > /dev/null 2>&1; then
                    echo "App is up after attempt $i"
                    break
                  fi
                  echo "Attempt $i/12 — not ready, waiting 5s..."
                  sleep 5
                done

                # Run selftest (LLM + tool smoke test)
                echo "Running selftest..."
                result=$(curl -sf --max-time 120 "${APP_URL}/api/selftest" 2>&1) || {
                  echo "SELFTEST FAILED — triggering rollback"
                  echo "$result"
                  exit 1
                }
                echo "Selftest passed: $result"

    on_failure:
      do:
        - task: auto-rollback
          privileged: true
          config:
            platform: linux
            image_resource:
              type: registry-image
              source: { repository: docker, tag: cli }
            params:
              DOCKER_HOST: ((docker-host))
            run:
              path: sh
              args:
                - -exc
                - |
                  docker tag the-one:rollback the-one:latest 2>/dev/null || exit 1
                  docker rm -f the-one 2>/dev/null || true
                  docker run -d \
                    --name the-one \
                    --restart unless-stopped \
                    -p 8484:8484 \
                    -v /home/cprch/projects/the-one:/workspace \
                    -e THE_ONE_LLM_PROVIDER=ollama \
                    -e THE_ONE_LLM_MODEL=qwen2.5:7b \
                    -e THE_ONE_LLM_BASE_URL=http://host.docker.internal:11434/v1 \
                    -e THE_ONE_HOST=0.0.0.0 \
                    -e THE_ONE_WORKSPACE_DIR=/workspace \
                    -e THE_ONE_CONCOURSE_TARGET=local \
                    -e THE_ONE_CONCOURSE_PIPELINE=the-one \
                    -e THE_ONE_CONCOURSE_URL=http://host.docker.internal:8080 \
                    -e THE_ONE_CONCOURSE_USER=the-one \
                    -e THE_ONE_CONCOURSE_PASS=((concourse-pass)) \
                    -e THE_ONE_CONCOURSE_TEAM=the-one \
                    --add-host host.docker.internal:host-gateway \
                    the-one:latest
                  echo "Rolled back to previous image"

  - name: rollback
    plan:
      - task: rollback-container
        privileged: true
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: docker, tag: cli }
          params:
            DOCKER_HOST: ((docker-host))
          run:
            path: sh
            args:
              - -exc
              - |
                docker tag the-one:rollback the-one:latest || {
                  echo "No rollback image found"
                  exit 1
                }
                docker rm -f the-one 2>/dev/null || true
                docker run -d \
                  --name the-one \
                  --restart unless-stopped \
                  -p 8484:8484 \
                  -v /home/cprch/projects/the-one:/workspace \
                  -e THE_ONE_LLM_PROVIDER=ollama \
                  -e THE_ONE_LLM_MODEL=qwen2.5:7b \
                  -e THE_ONE_LLM_BASE_URL=http://host.docker.internal:11434/v1 \
                  -e THE_ONE_HOST=0.0.0.0 \
                  -e THE_ONE_WORKSPACE_DIR=/workspace \
                  -e THE_ONE_CONCOURSE_TARGET=local \
                  -e THE_ONE_CONCOURSE_PIPELINE=the-one \
                  -e THE_ONE_CONCOURSE_URL=http://host.docker.internal:8080 \
                  -e THE_ONE_CONCOURSE_USER=the-one \
                  -e THE_ONE_CONCOURSE_PASS=((concourse-pass)) \
                  -e THE_ONE_CONCOURSE_TEAM=the-one \
                  --add-host host.docker.internal:host-gateway \
                  the-one:latest
                echo "Rolled back to previous image"

  - name: restart
    plan:
      - task: restart-container
        privileged: true
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: docker, tag: cli }
          params:
            DOCKER_HOST: ((docker-host))
          run:
            path: sh
            args:
              - -exc
              - |
                docker restart the-one
                echo "Container restarted"
