# Concourse pipeline — build the Windows installer for the-one and publish it to
# the local minio (S3) bucket. Lives in the `the-one` Concourse team.
#
# Set / update with:
#   fly -t the-one set-pipeline -p windows-installer -c ci/windows-installer.pipeline.yml
#
# Secrets resolve from Vault (concourse/the-one/windows-installer/*):
#   - github-deploy-key.private_key   (read-only deploy key for this repo)
#   - minio.access_key / minio.secret_key / minio.endpoint / minio.bucket
# No credentials live in this file.
#
# The `repo` git resource POLLS GitHub (the Concourse web node is localhost-only, so
# webhook push is not possible) and the build job auto-triggers on each new commit to
# the tracked branch — effective "rebuild on push" within the poll interval.
#
# Publish: Concourse build containers use external DNS (8.8.8.8) so the compose
# service name `minio` does NOT resolve inside them. minio is reached by its
# compose-network IP via ((minio.endpoint)) (same approach the epipen pipeline uses).
# If `docker compose down/up` reassigns minio's IP, update that Vault value:
#   fly/MCP set_secret concourse/the-one/windows-installer/minio endpoint=<ip:9000>
#
# NOTE: tracks `main` — the Windows packaging landed there (M15 F5, v0.2.1). The
# pipeline builds the installer on every push to main (the flight branches are merged
# and deleted).

resources:
  - name: repo
    type: git
    icon: github
    source:
      uri: git@github.com:msieurthenardier/the-one.git
      branch: main
      private_key: ((github-deploy-key.private_key))

jobs:
  - name: build-windows-installer
    plan:
      - get: repo
        trigger: true
      - task: build
        file: repo/ci/tasks/windows-installer-build.yml
      - task: publish-to-minio
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: minio/mc
          inputs:
            - name: installer
          params:
            MINIO_KEY: ((minio.access_key))
            MINIO_SECRET: ((minio.secret_key))
            MINIO_ENDPOINT: ((minio.endpoint))
            MINIO_BUCKET: ((minio.bucket))
          run:
            path: sh
            args:
              - -ec
              - |
                export MC_HOST_minio="http://${MINIO_KEY}:${MINIO_SECRET}@${MINIO_ENDPOINT}"
                mc cp installer/the-one-setup-*.exe "minio/${MINIO_BUCKET}/"
                echo "=== published to minio/${MINIO_BUCKET} ==="
                mc ls "minio/${MINIO_BUCKET}/"
