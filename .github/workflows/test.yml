name: test

# Jobs run bare `python -m pytest` (not the local `run-tests.sh` group-kill
# wrapper) deliberately: GitHub-hosted runners are ephemeral, so any orphaned
# child processes (uvicorn/Chromium) die with the runner VM. Locally the
# wrapper is mandatory for browser/long-subprocess tests — do not copy this
# bare invocation into local docs or Makefile targets.

# Routine tests run on local Concourse (the-one pipeline). This workflow is kept as a
# manual break-glass fallback only — its PR/push triggers were removed in M15 F8 to stop
# consuming GitHub Actions minutes. Pre-push gate: fly -t the-one execute -c ci/tasks/test.yml -i repo=.
on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[all-llms,dev]"
      - name: Run default suite (host-native)
        run: python -m pytest tests/ --timeout=300 --tb=short

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the diff below can reach the base
      # Path-filter: the browser suite (~15 min) only needs to run when the web
      # UI changes. Most PRs (connectors/DB/MCP/agent) don't touch it. ADD any
      # new UI surface to the grep below, or the browser suite won't run on PRs
      # that change it. Inline git-diff (no third-party action) — avoids the
      # PR-API permission and the Node-version churn of paths-filter actions.
      # Missing/unreachable base (first push, new branch) → run everything
      # (conservative-safe).
      - name: Detect UI changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "ui=true" >> "$GITHUB_OUTPUT"   # no usable base → run it
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD \
               | grep -qE '^(the_one/interfaces/web/|tests/browser/|pyproject\.toml$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.changes.outputs.ui == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        if: steps.changes.outputs.ui == 'true'
        run: pip install -e ".[all-llms,dev]"
      - name: Provision Chromium
        if: steps.changes.outputs.ui == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests (host-native)
        if: steps.changes.outputs.ui == 'true'
        env:
          THE_ONE_DEV_MODE: "true"
        run: python -m pytest -m browser tests/browser/ --timeout=300 --tb=short

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash   # Git Bash on the runner — avoids PowerShell stripping
                      # the quotes in `pip install -e ".[all-llms,dev]"` and
                      # obscuring the real test inventory behind an install fail.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[all-llms,dev]"
      # WINDOWS CURATED SUBSET (DD7 revised — 2026-06-13)
      # ---------------------------------------------------------------
      # This explicit file list is the Windows-relevant OS-divergent surface.
      # MAINTENANCE NOTE: if you add a NEW test file that exercises
      # platform-divergent behavior (filesystem paths, env allowlist,
      # PTY/shell, encryption, execution), add it here too — or it will
      # NOT run on Windows.  The full suite stays the source of truth on
      # Linux; this lane covers only the ~427-test OS-divergent subset.
      # (Future refinement: a `cross_platform` pytest marker could
      # auto-include new files; deferred to keep this leg's churn low.)
      - name: Run platform-relevant subset (Windows — DD7 revised)
        run: |
          python -m pytest --timeout=300 --tb=short \
            tests/test_platform_paths.py tests/test_platform_shell.py \
            tests/test_platform_interpreter.py tests/test_platform_tempdirs.py \
            tests/test_pty_dispatch.py tests/test_pty_session.py tests/test_pty_windows.py \
            tests/test_filesystem_tools.py tests/test_filesystem_helpers.py \
            tests/test_filesystem_config.py \
            tests/test_config.py tests/test_config_data_dir.py \
            tests/test_execution_tools.py tests/test_execution_helpers.py \
            tests/test_execution_config.py \
            tests/test_encryption.py \
            tests/test_sandbox_factory.py tests/test_sandbox_contract.py \
            tests/test_logging_config.py

  bwrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 (ubuntu-latest) restricts unprivileged userns creation
        # via AppArmor by default. Without this, the factory's empirical
        # userns probe fails and gracefully degrades to passthrough — tools
        # then run UNCONFINED and every containment assertion in
        # `-m requires_bwrap` fails. This sysctl restores real kernel-enforced
        # bwrap on the runner.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Set up venv from the SYSTEM Python (not actions/setup-python)
        # Deliberate: setup-python's hostedtoolcache interpreter lives under
        # /opt — outside the boxed-mode minimal rootfs (/usr) — so every
        # boxed (minimal_rootfs) spawn fails at execvp. A venv created from
        # the system python3 has symlinks that resolve_python() follows back
        # into /usr, matching the deployment-shaped path (see
        # the_one/platform/interpreter.py::resolve_python).
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[all-llms,dev]"
      - name: Run @requires_bwrap sandbox tests
        run: python -m pytest -m requires_bwrap tests/ --timeout=300 --tb=short
