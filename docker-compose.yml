services:
  the-one:
    build: .
    container_name: the-one
    restart: unless-stopped
    ports:
      - "8484:8484"
    # Override the image's `the-one serve` CMD with a direct uvicorn
    # invocation that auto-reloads on `the_one/` source edits — pairs
    # with the dev bind-mounts below so iteration on tool source
    # propagates to the live server without `docker compose restart`.
    # `watchfiles` is already in the image (uvicorn ships it as a
    # reload-extra dependency, version 1.1.1 confirmed).
    # Surfaced as a follow-up after F4 HAT scenario 1 — see flight log
    # Anomalies for the original incident write-up.
    command: >
      uvicorn the_one.interfaces.web.app:app
      --host 0.0.0.0
      --port 8484
      --reload
      --reload-dir /app/the_one
    volumes:
      - the_one_data:/root/.the-one
      # F9 L2 D2: named volumes (NOT bind-mounts — bind-mounts recreate the F8
      # UID-drift papercut since the container runs as root) for the
      # generic-runtime caches. First spawn of `uvx <pkg>` / `npx <pkg>` /
      # `pipx run <pkg>` fetches the package; subsequent spawns hit cache.
      # Volumes survive `make rebuild` so cache state persists across image
      # rebuilds. `/root/.cache/uv` covers BOTH `uv` AND `uvx` (uvx is
      # `uv tool run` — single shared cache, no separate uvx path).
      - the_one_uv_cache:/root/.cache/uv
      - the_one_pipx_state:/root/.local/share/pipx
      - the_one_npm_cache:/root/.npm
      # Dev bind-mounts: host the_one/ becomes the live source seen by both the
      # WORKDIR-resolved import path (/app/the_one) AND the pip-installed site-
      # packages copy. Eliminates the "docker cp into both paths" friction that
      # F3 suffered through during every leg. Reversible: delete these two
      # lines to restore the production-style frozen image.
      - ./the_one:/app/the_one
      - ./the_one:/usr/local/lib/python3.11/site-packages/the_one
      # Mount tests/ so test edits are live too (F4 L1b finding —
      # otherwise every leg adding tests would need `docker cp tests/...`).
      - ./tests:/app/tests
      # Mount scripts/ read-only so utility scripts (e.g. brand-asset
      # derivation) can be invoked via `docker exec the-one python
      # /app/scripts/...` without baking them into the image. Read-only
      # because scripts write outputs into the_one/ (already rw-bound),
      # never into scripts/ itself.
      - ./scripts:/app/scripts:ro
    environment:
      - THE_ONE_LLM_PROVIDER=ollama
      - THE_ONE_LLM_MODEL=qwen2.5:7b
      - THE_ONE_LLM_BASE_URL=http://host.docker.internal:11434/v1
      - THE_ONE_HOST=0.0.0.0
      - THE_ONE_DEV_MODE=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Sandbox privilege model (F3 §10): bubblewrap requires unprivileged
    # user-namespace creation, which docker's default seccomp profile
    # filters regardless of capabilities. Both grants are necessary —
    # SYS_ADMIN alone won't unblock unshare(CLONE_NEWUSER). See flight
    # spec §10 for the threat-model justification.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    networks:
      - default

networks:
  default:

volumes:
  the_one_data:
  # F9 L2 D2: generic-runtime caches for stdio MCPs invoked via uvx / npx /
  # pipx run. See the service `volumes:` block above for path rationale.
  the_one_uv_cache:
  the_one_pipx_state:
  the_one_npm_cache:
