name: linux-packages

# Stub for the default branch (Mission 32 Flight 2, DD10). GitHub validates `workflow_dispatch`
# inputs against the default branch's copy of a workflow, so this file carries the same `on:`
# block as the flight branch's. The real steps live on the flight branch; dispatch with
#   gh workflow run linux-packages.yml --ref flight/02-linux-packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to build (empty: the version in the_one/__init__.py)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Package version to build (empty: the version in the_one/__init__.py)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  stub:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Stub
        timeout-minutes: 1
        run: echo "the real steps live on the flight branch; dispatch with --ref"
