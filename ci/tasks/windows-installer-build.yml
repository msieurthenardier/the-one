# Windows installer build task — runs on the Concourse `platform: windows` worker.
# Consumes the `repo` git input, produces `installer/the-one-setup-<ver>.exe`.
# Toolchain is provisioned per-run via choco (Python 3.12 to match CI; Inno Setup). The build
# itself is packaging/windows/build.ps1, the one Windows recipe that GitHub also calls
# (Mission 32 Flight 4): it stages the source, renders the installer's product.iss from
# packaging/product.toml, freezes from the staged copy, runs strict `doctor` and builds the
# installer. Its working files (build venv, stage, PyInstaller work and dist, ISCC output) live
# in `build/`, a sibling of `repo`, never inside the repo.
#
# Squawk 0009 / 0015 (the locked dependency closure, `uv export` then `pip install --no-deps`) and
# the throwaway per-build venv (build 606657's stale hf_xet) moved into build.ps1 with the rest of
# the recipe; tests/test_packaging_locked_closure.py now pins them there.
platform: windows

inputs:
  - name: repo

outputs:
  - name: installer

run:
  path: powershell
  args:
    - -NoProfile
    - -ExecutionPolicy
    - Bypass
    - -Command
    - |
      $ErrorActionPreference = "Stop"
      Write-Host "=== [1/4] provision toolchain (choco: Python 3.12 + Inno Setup) ==="
      choco install python312 -y --no-progress
      choco install innosetup -y --no-progress
      $py = "C:\Python312\python.exe"
      if (!(Test-Path $py)) { throw "python312 not at $py" }
      & $py --version
      Write-Host "=== [2/4] environment ==="
      # Recorded so the log shows what this worker has: the recipe must not need git (a
      # `fly execute` upload is a worktree whose .git gitlink points at nothing on the worker).
      $gitCmd = Get-Command git -ErrorAction SilentlyContinue
      if ($gitCmd) { Write-Host "git on PATH: yes ($($gitCmd.Source))" } else { Write-Host "git on PATH: no" }
      $taskDir = (Get-Location).Path
      $buildDir = Join-Path $taskDir "build"
      $installerDir = Join-Path $taskDir "installer"
      Write-Host "=== [3/4] build (packaging/windows/build.ps1) ==="
      & (Join-Path $taskDir "repo\packaging\windows\build.ps1") -Out $buildDir -Python $py
      # a throw inside the script stops this script under $ErrorActionPreference = Stop; this
      # catches a script that ended through `exit` with a failure code instead
      if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "build.ps1 failed ($LASTEXITCODE)" }
      Write-Host "=== [4/4] stage artifact for s3 put ==="
      $built = Get-ChildItem -Path $buildDir -Recurse -File -Filter "the-one-setup-*.exe" | Select-Object -First 1
      if (-not $built) { throw "no installer under $buildDir" }
      Copy-Item $built.FullName $installerDir
      Get-ChildItem $installerDir | Format-Table Name,Length
      Write-Host "BUILD OK: $($built.Name)"
