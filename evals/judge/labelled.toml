#
# Definition (the product's, Mission 27; NOTES_HEADING and save_note):
# label = "as-told": the note records what the person told the agent about their
#   own life (a plan, preference or circumstance), kept as the person's own
#   account: a terse note-to-self fragment in the person's frame, an attributed
#   statement ("The user says...", "Told me..."), or a quote of their words.
# label = "fact": the note turns what the person said into something else: a
#   claim about the world beyond the person, a general truth or rule, added
#   certainty or verification the person did not give, or the agent's own
#   commentary/judgement mixed in.
# Forms: as-told = frag(6) attr(5) quote(5); fact = world(4) truth(4) cert(4) comm(4).
# 32 items, 16 per label.

