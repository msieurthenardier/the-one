name: windows-installer

# Build + smoke-test the Windows installer ONLY on a version tag pushed to main
# (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
#
# Day-to-day installer builds run in the local Concourse `the-one` team (unlimited,
# on every push). GitHub builds the release artifact only when a version is cut — so
# routine PRs/pushes don't burn a ~10-min Windows freeze here. (The unit-test CI lives
# in test.yml and still runs on every PR / main push.)
on:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    # Freezes the one-dir from packaging/windows/the-one.spec, proves the DD2
    # child-spawn fix against the REAL frozen binary (the spawn-fix's only true
    # apparatus — a checkout interpreter can't exercise a PyInstaller bundle), then
    # builds the Inno installer, then publishes a GitHub Release with the .exe
    # attached. Tag-gated: runs on `v*` tags only.
    runs-on: windows-2022
    permissions:
      contents: write # required for `gh release create`/`upload` (the GITHUB_TOKEN
        # is read-only by default).
    defaults:
      run:
        shell: bash # Git Bash on the runner — avoids PowerShell stripping the quotes
          # in `pip install -e ".[gui,all-llms]"` and obscuring a real install failure.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      # The [gui] extra is REQUIRED — without pywebview→pythonnet the spec's collect_*
      # import-fails at build time.
      - name: Install GUI freeze deps + PyInstaller
        # Squawk 0009: install the LOCKED closure, not a fresh resolve. The frozen
        # app must ship the exact tested/pinned dependency set from uv.lock — a
        # `pip install -e ".[gui,all-llms]"` re-resolves the ranges at build time
        # and can bundle an untested SDK (e.g. an anthropic newer than the locked
        # 0.96.0 whose messages.stream() dropped `temperature`, crashing the first
        # chat turn). Export the same closure the pr-lint workflow audits
        # (pr-lint.yml:61), install it, then install the project itself --no-deps.
        run: |
          pip install uv
          uv export --no-dev --no-emit-project --extra gui --extra all-llms --format requirements-txt > release-requirements.txt
          pip install -r release-requirements.txt
          pip install -e . --no-deps
          pip install pyinstaller
      # Build the frozen one-dir from the checked-in spec. `test -f` fails fast if the
      # bundle exe name drifts; any PyInstaller error (incl. a missing pywinpty
      # .pyd/winpty.dll) already exits non-zero and fails the job.
      - name: Build frozen one-dir (PyInstaller)
        run: |
          set -eo pipefail
          pyinstaller --noconfirm packaging/windows/the-one.spec
          test -f dist/the-one/the-one.exe
      # PROOF (a) — frozen doctor. The doctor's own exit code is the gate; pipefail
      # ensures `tee` can't mask a non-zero exit. grep both `child spawn: OK`
      # (clean_subprocess_env + PATH augmentation work on the packaged binary) AND
      # `RESULT: PASS` (also covers the frozen resolve_python interpreter gate).
      - name: Packaged-smoke (a) — frozen doctor
        run: |
          set -eo pipefail
          ./dist/the-one/the-one.exe doctor | tee doctor.out
          grep -q "child spawn: OK" doctor.out
          grep -q "desktop shell: OK" doctor.out
          # Vector-store probes (M24 F01 L01). Asserted BY NAME, not via the
          # aggregate: a probe dropped from run_doctor's gates list would still
          # print RESULT: PASS, which is exactly the silent regression these
          # permanent probes exist to prevent.
          grep -q "sqlite-vec: OK" doctor.out
          grep -q "usearch: OK" doctor.out
          # FTS5 probe (Flight 2 Leg 2, DD-11) — unconditional, not frozen-only,
          # but asserted here BY NAME for the same reason as the others: a probe
          # dropped from run_doctor's gates list would still print RESULT: PASS.
          grep -q "fts5: OK" doctor.out
          # Embedding-model probe (M24 F01 L02). Same by-name rule, and the one
          # gate that also proves a DATA tree survived the freeze: the bundled
          # float16 potion-retrieval-32M weights must load from the packaged
          # path. The probe runs with HF_HUB_OFFLINE=1, so this line cannot be
          # satisfied by a hub download on a networked runner.
          grep -q "embedding model: OK" doctor.out
          grep -q "RESULT: PASS" doctor.out
      # PROOF (b) — frozen serve answers /api/info. Background the frozen serve and
      # poll with an httpx Python probe (NOT curl — httpx is a runtime dep and the
      # exact path the product polls with). Assert 200 + version == the_one.__version__.
      # The gate is live (Mission 20 Flight 1) — /api/info asserts on response
      # CONTENT (the version), so per the leg's "credential if it asserts anything
      # about content" rule this probe is credentialed rather than switched to the
      # unauthenticated liveness endpoint. `get_credential()` (create-on-first-use)
      # is correct here: this runner process and the frozen serve share the same
      # OS-user default data directory (THE_ONE_DATA_DIR is not overridden anywhere
      # in this job), so whichever of the two creates the credential first, the
      # other reads that same file back.
      - name: Packaged-smoke (b) — frozen serve /api/info
        run: |
          set -eo pipefail
          ./dist/the-one/the-one.exe serve &
          python - <<'PY'
          import time, sys, httpx, the_one
          from the_one.api_credential import get_credential
          headers = {"Authorization": f"Bearer {get_credential().encode()}"}
          for _ in range(30):
              try:
                  r = httpx.get("http://127.0.0.1:8484/api/info", headers=headers, timeout=2.0)
                  if r.status_code == 200:
                      assert r.json()["version"] == the_one.__version__, r.json()
                      sys.exit(0)
              except Exception:
                  pass
              time.sleep(1)
          sys.exit("frozen serve did not answer /api/info 200 within 30s")
          PY
      # PROOF (c) — single-instance decision input. With the frozen serve still up,
      # assert the Flight-4 probe (run from the runner's installed SOURCE) sees the
      # frozen instance as ours. Under DD11 (Mission 20 Flight 1 Leg 5) "ours" means
      # "shares our credential" — _select_port sends the credential itself
      # internally (via get_credential()), so no change is needed at this call site;
      # it resolves ours=True because both processes share the same credential file
      # per the note above. Teardown: `taskkill //F //IM` is Windows-native +
      # MSYS-escaped; best-effort (ephemeral runner → hygiene, not correctness).
      - name: Packaged-smoke (c) — single-instance probe + teardown
        run: |
          set -eo pipefail
          python -c "from the_one.interfaces.app import _select_port; p,ours=_select_port('127.0.0.1',8484); assert ours,(p,ours)"
          taskkill //F //IM the-one.exe || true
      # Inno installer — AFTER the smoke so we never ship an unproven build. The
      # windows-2022 runner already ships Inno Setup >=6.3 (currently 6.7.1, which
      # supports the `x64compatible` arch token); do NOT pin a version (pinning a
      # downgrade makes choco exit 1). ISCC isn't guaranteed on PATH, so locate it.
      # `//D` is the MSYS escape for a leading `/D` — do NOT "fix" it back to `/D`.
      - name: Build Inno installer
        run: |
          set -eo pipefail
          choco install innosetup -y --no-progress || true
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || ISCC="$(command -v iscc)"
          VER=$(python -c "import the_one; print(the_one.__version__)")
          "$ISCC" //DAppVersion=$VER packaging/windows/the-one.iss
          test -f "packaging/windows/Output/the-one-setup-$VER.exe"
      # Publish a GitHub Release for the tag with the installer attached. Release
      # ASSETS are stored separately from Actions artifacts — they do NOT count against
      # the Actions artifact-storage quota — so this is the right home for the
      # distributable .exe. Runs only after the freeze + smoke + Inno build pass, so a
      # red build never publishes a release. Idempotent: create the release if it
      # doesn't exist (e.g. the tag was pushed before this workflow landed), then
      # upload --clobber so a re-run replaces the asset.
      - name: Publish GitHub Release with installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          VER=$(python -c "import the_one; print(the_one.__version__)")
          EXE="packaging/windows/Output/the-one-setup-$VER.exe"
          test -f "$EXE"
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG — Windows installer" \
              --generate-notes
          fi
          gh release upload "$TAG" "$EXE" --clobber
