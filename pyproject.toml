[project]
name = "the-one"
version = "0.1.0"
description = "A personal agentic system — LLM-agnostic, tool-rich, monolithic."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # readability-lxml + markdownify: runtime feature deps consumed by
    # FetchUrlTool (the_one/tools/web.py) when fetching text/html. Keep
    # in base dependencies — moving to [dev] would re-open the host-env
    # gap that Flight 01 Leg 01 surfaced (and commit e65077e closed).
    "readability-lxml>=0.8",
    "markdownify>=0.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    "cryptography>=43.0",
    # M10 mission constraint: "Wire-protocol clients use maintained SDKs
    # with pinned versions" — F8 L2 pins discord.py (the Discord gateway
    # SDK used by DiscordPlugin in F8 L3+). Bound to 2.4.x to lock the
    # connector's surface against accidental major-version SDK upgrades.
    "discord.py>=2.4,<2.5",
    "mcp==1.27.0",
]

[project.optional-dependencies]
# openai>=2.16 floor: openrouter_provider's no-leak invariant
# (the_one/llm/openrouter_provider.py:21-32) depends on the SDK
# rejecting api_key="" at construction time, which became the public
# behaviour in openai 2.16. Earlier versions accept the empty string and
# silently fall back to OPENAI_API_KEY, defeating the no-leak guard.
openai = ["openai>=2.16"]
anthropic = ["anthropic>=0.40"]
all-llms = ["openai>=2.16", "anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-timeout>=2.4", "ruff>=0.6", "playwright==1.58.0", "pytest-playwright>=0.5", "pillow>=10.0", "pixelmatch>=0.3", "asgi-lifespan>=2.0", "pip-audit>=2.7"]

[project.scripts]
the-one = "the_one.main:cli_entry"

[tool.setuptools.packages.find]
include = ["the_one*"]

[tool.setuptools.package-data]
the_one = ["interfaces/web/static/**/*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib import-mode + explicit pythonpath: required so the existing
# `from conftest import FakeLLM, StubTool` pattern in tests/test_*.py keeps
# resolving to tests/conftest.py once tests/browser/conftest.py exists.
# Without this, pytest's default rootdir-prepend caches the nested browser
# conftest in sys.modules under the bare name "conftest" and shadows the
# top-level fixtures module.
# Per-marker deselect math (last verified L0): live=10, browser=288, pixel=12, requires_bwrap=2, total=312
addopts = "-m 'not live and not browser and not pixel and not requires_bwrap and not discord_hat' --import-mode=importlib"
pythonpath = ["tests"]
markers = [
    "live: marks tests that call real LLM APIs (deselect with '-m \"not live\"')",
    "browser: marks tests that require a browser via Playwright (deselect with '-m \"not browser\"')",
    "pixel: marks visual-regression snapshot tests (local-only; baselines are gitignored). Run with '-m pixel'; regenerate with '-m pixel --snapshot-update'. Excluded from CI.",
    "requires_bwrap: marks tests that need a real bwrap binary in $PATH (deselect with '-m \"not requires_bwrap\"')",
    "discord_hat: live multi-bot Discord HAT (needs bot tokens + a test guild; deselect by default)",
]
norecursedirs = ["workspace", ".worktrees", "node_modules", ".git"]


[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["workspace"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
