[project]
name = "the-one"
version = "0.10.0"
description = "A personal agentic system — LLM-agnostic, tool-rich, monolithic."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # readability-lxml + markdownify: runtime feature deps consumed by
    # FetchUrlTool (the_one/tools/web.py) when fetching text/html. Keep
    # in base dependencies — moving to [dev] would re-open the host-env
    # gap that Flight 01 Leg 01 surfaced (and commit e65077e closed).
    "readability-lxml>=0.8",
    "markdownify>=0.13",
    "pydantic>=2.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Direct dep as of Flight 4 (M24 F04 L01, DD-11): the app imports
    # `watchfiles` itself now (the change-monitoring watcher, DD-0/DD-9's
    # `doctor` gate) rather than reaching it only transitively through
    # `uvicorn[standard]`'s reload supervisor, which `the-one serve` never
    # uses. `uv.lock` already pins 1.1.1 with Windows/macOS/Linux wheels —
    # this declaration changes no resolved version.
    "watchfiles>=1.0",
    "websockets>=13.0",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    # 1.28.1 closes PYSEC-2026-3481/3482/3483 (2026-07-28 pr-lint pip-audit
    # run; 1.27.2 fixed only 3481/3482 — 3483 needed 1.28.1).
    "mcp==1.28.1",
    # CVE floors (deps — some direct, most transitive — promoted to
    # explicit floors so any resolve that starts from these ranges instead
    # of uv.lock, e.g. `pip install -e ".[gui,all-llms]"` in
    # .github/workflows/windows-installer.yml, still lands on the fixed
    # versions, not just uv.lock's pins). Each line cites the version that
    # fixed the CVE, verified against the advisory:
    #  - idna via httpx/anyio/requests (closes CVE-2026-45409)
    #  - starlette via fastapi/mcp/sse-starlette (closes PYSEC-2026-248,
    #    PYSEC-2026-249 — same run)
    #  - cryptography, direct dep (closes GHSA-537c-gmf6-5ccf, a
    #    statically-linked vulnerable OpenSSL; fixed in 48.0.1; floor raised
    #    to 50.0.0 for PYSEC-2026-3552 — 2026-08-07 release-closure run)
    #  - pydantic-settings, direct dep (closes GHSA-4xgf-cpjx-pc3j,
    #    CVE-2026-58203, symlink escape in NestedSecretsSettingsSource;
    #    fixed in 2.14.2)
    #  - python-multipart, pure transitive via fastapi/starlette upload
    #    parsing (no prior explicit floor; closes GHSA-5rvq-cxj2-64vf /
    #    CVE-2026-53539 and GHSA-v9pg-7xvm-68hf / CVE-2026-53540; fixed in
    #    0.0.31)
    #  - soupsieve, pure transitive via readability-lxml's bs4 dep (no
    #    prior explicit floor; closed GHSA-2wc2-fm75-p42x /
    #    CVE-2026-49476 and GHSA-836r-79rf-4m37 / CVE-2026-49477 at 2.8.4;
    #    floor raised to 2.9.0 for CVE-2026-85999 and CVE-2026-86000, two
    #    ReDoS advisories in the CSS-selector compiler — 2026-09-17
    #    pip-audit run; fixed in 2.9.0)
    #  - lxml-html-clean, pure transitive via readability-lxml (no prior
    #    explicit floor; closes GHSA-4jhm-jv67-739f / CVE-2026-49825,
    #    xlink:href javascript: URL bypass; fixed in 0.4.5)
    #  - lxml is not itself CVE-affected here; floor is forced by the
    #    lxml-html-clean>=0.4.5 requirement above (lxml-html-clean 0.4.5
    #    requires lxml>=6.1.1) — a dependency-of-the-pin floor, not an
    #    independent CVE fix.
    #  - click, pure transitive via uvicorn/mcp (no prior explicit floor;
    #    closes PYSEC-2026-2132; fixed in 8.3.3 — 2026-07-28 pr-lint
    #    pip-audit run)
    "click>=8.3.3",
    "idna>=3.15",
    "starlette>=1.3.1",
    "cryptography>=50.0.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "soupsieve>=2.9.0",
    "lxml-html-clean>=0.4.5",
    "lxml>=6.1.1",
    "platformdirs>=4.0",
    # ConPTY backend for Windows PTY sessions (M15 F3 Leg 2). The env marker
    # ensures this never installs on Linux/macOS — pywinpty is Windows-only.
    "pywinpty>=2.0; sys_platform == \"win32\"",
    # Vector store for the knowledge-base mission (M24 F02 L06 / DD-9). The
    # operator chose usearch at the Flight 2 decision checkpoint
    # (flight-log.md, "DD-9 decision checkpoint (2026-09-15)"): it was the
    # only benchmarked candidate to clear the p95 <= 250ms bar at the
    # corpus ceiling on Windows. usearch is a standalone HNSW id->vector
    # index (pulls numpy +
    # the native numkong extension unconditionally, per
    # usearch/__init__.py — numkong stays even though it never loads on the
    # frozen Windows build, Known Issues); it satisfies the mission's
    # vectors-and-ids-only constraint natively. It is exercised by the
    # frozen-only `usearch` doctor probe in the_one/diagnostics.py, which is
    # the regression gate for the native payload surviving the freeze.
    "usearch>=2.16",
    # Static embedding backend for the knowledge-base mission (M24 F01 DD-1/DD-2).
    # model2vec loads the float16 `potion-retrieval-32M` weights committed under
    # the_one/embeddings/data/ — a base dependency, not an extra, because the
    # model is package data present in every checkout and the doctor's
    # `embedding model` gate is unconditional (DD-7). Its numpy requirement is
    # already satisfied: numpy entered the closure transitively via usearch.
    "model2vec>=0.9",
]

[project.optional-dependencies]
# openai>=2.16 floor: openrouter_provider's no-leak invariant
# (the_one/llm/openrouter_provider.py:21-32) depends on the SDK
# rejecting api_key="" at construction time, which became the public
# behaviour in openai 2.16. Earlier versions accept the empty string and
# silently fall back to OPENAI_API_KEY, defeating the no-leak guard.
openai = ["openai>=2.16"]
anthropic = ["anthropic>=0.40,<0.97"]
all-llms = ["openai>=2.16", "anthropic>=0.40,<0.97"]
gui = [
    # Upgrade blocker: pywebview 6.x's WinForms backend adds update_title_bar_theme(),
    # which sets DWM attributes 20/38 from the OS theme on creation and on
    # UserPreferenceChanged, overwriting the app-chosen title-bar theme (the window
    # chrome, M25 F5). Re-check that before lifting <6; see agents.md "Window chrome".
    "pywebview[gtk]>=5,<6; sys_platform == 'linux'",
    "pywebview>=5,<6; sys_platform != 'linux'",
    "pystray>=0.19",
    # pillow>=12.3 floor: closes PYSEC-2026-2253..2257, PYSEC-2026-3451..3454,
    # PYSEC-2026-3493..3496 (all fixed in 12.3.0 — 2026-07-28 full-venv
    # pip-audit). The gui extra ships in the Windows installer
    # (.github/workflows/windows-installer.yml re-resolves from these
    # ranges), so this floor must bind there — same dual-binding rule as
    # the runtime CVE-floor block above.
    "pillow>=12.3",
]
# urllib3 floor is a toolchain-only CVE fix (reaches the tree solely via
# requests, pulled by dev/test tooling — pip-audit/cachecontrol/pytest-base-url;
# NOT in the runtime closure). Closes PYSEC-2026-142, PYSEC-2026-141.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-timeout>=2.4", "ruff==0.15.15", "pre-commit>=3", "playwright==1.58.0", "pytest-playwright>=0.5", "pillow>=12.3", "pixelmatch>=0.3", "asgi-lifespan>=2.0", "pip-audit>=2.7", "urllib3>=2.7.0"]

[project.scripts]
the-one = "the_one.main:cli_entry"

[tool.uv]
# Squawk 0049 / M24 F02 L06: huggingface-hub pulls hf-xet (a Rust Hub
# transfer accelerator) on x86_64/arm64. The app never downloads from the
# Hub — the embedding model is package data and HF_HUB_OFFLINE=1 is
# forced — and huggingface_hub imports hf_xet lazily inside its download
# path only, so excluding it is safe and trims ~4 MB from the bundle.
exclude-dependencies = ["hf-xet"]

[tool.setuptools.packages.find]
include = ["the_one*"]

[tool.setuptools.package-data]
# NOTE: globs on the `the_one` key deliberately cross sub-package boundaries —
# `interfaces/web/static/**/*` is the long-standing proof. The bundled embedding
# model (M24 F01 L02) is therefore declared here as `embeddings/data/**/*`
# rather than under a new `the_one.embeddings` key. It must cover all five files
# save_pretrained emits (README.md, config.json, model.safetensors,
# modules.json, tokenizer.json) — model2vec's loader validates the layout, so a
# partial glob fails at load rather than degrading silently.
the_one = ["interfaces/web/static/**/*", "llm/data/*.json", "embeddings/data/**/*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# importlib import-mode + explicit pythonpath: required so the existing
# `from conftest import FakeLLM, StubTool` pattern in tests/test_*.py keeps
# resolving to tests/conftest.py once tests/browser/conftest.py exists.
# Without this, pytest's default rootdir-prepend caches the nested browser
# conftest in sys.modules under the bare name "conftest" and shadows the
# top-level fixtures module.
# Per-marker deselect math (last verified Mission 23 Flight 1): live=15, browser=513, pixel=12, requires_bwrap=12, total=552
# (discord_hat retired with the connector package — Mission 23 Flight 1)
addopts = "-m 'not live and not browser and not pixel and not requires_bwrap' --import-mode=importlib"
pythonpath = ["tests"]
markers = [
    "live: marks tests that call real LLM APIs (deselect with '-m \"not live\"')",
    "browser: marks tests that require a browser via Playwright (deselect with '-m \"not browser\"')",
    "pixel: marks visual-regression snapshot tests (local-only; baselines are gitignored). Run with '-m pixel'; regenerate with '-m pixel --snapshot-update'. Excluded from CI.",
    "requires_bwrap: marks tests that need a real bwrap binary in $PATH (deselect with '-m \"not requires_bwrap\"')",
]
norecursedirs = ["workspace", ".worktrees", "node_modules", ".git"]


[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["workspace"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
