name: test

# Jobs run bare `python -m pytest` (not the local `run-tests.sh` group-kill
# wrapper) deliberately: GitHub-hosted runners are ephemeral, so any orphaned
# child processes (uvicorn/Chromium) die with the runner VM. Locally the
# wrapper is mandatory for browser/long-subprocess tests — do not copy this
# bare invocation into local docs or Makefile targets.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[all-llms,dev]"
      - name: Run default suite (host-native)
        run: python -m pytest tests/ --timeout=300 --tb=short

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the diff below can reach the base
      # Path-filter: the browser suite (~15 min) only needs to run when the web
      # UI changes. Most PRs (connectors/DB/MCP/agent) don't touch it. ADD any
      # new UI surface to the grep below, or the browser suite won't run on PRs
      # that change it. Inline git-diff (no third-party action) — avoids the
      # PR-API permission and the Node-version churn of paths-filter actions.
      # Missing/unreachable base (first push, new branch) → run everything
      # (conservative-safe).
      - name: Detect UI changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "ui=true" >> "$GITHUB_OUTPUT"   # no usable base → run it
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD \
               | grep -qE '^(the_one/interfaces/web/|tests/browser/|pyproject\.toml$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.changes.outputs.ui == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        if: steps.changes.outputs.ui == 'true'
        run: pip install -e ".[all-llms,dev]"
      - name: Provision Chromium
        if: steps.changes.outputs.ui == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests (host-native)
        if: steps.changes.outputs.ui == 'true'
        env:
          THE_ONE_DEV_MODE: "true"
        run: python -m pytest -m browser tests/browser/ --timeout=300 --tb=short

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash   # Git Bash on the runner — avoids PowerShell stripping
                      # the quotes in `pip install -e ".[all-llms,dev]"` and
                      # obscuring the real test inventory behind an install fail.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[all-llms,dev]"
      # WINDOWS CURATED SUBSET (DD7 revised — 2026-06-13)
      # ---------------------------------------------------------------
      # This explicit file list is the Windows-relevant OS-divergent surface.
      # MAINTENANCE NOTE: if you add a NEW test file that exercises
      # platform-divergent behavior (filesystem paths, env allowlist,
      # PTY/shell, encryption, execution), add it here too — or it will
      # NOT run on Windows.  The full suite stays the source of truth on
      # Linux; this lane covers only the ~427-test OS-divergent subset.
      # (Future refinement: a `cross_platform` pytest marker could
      # auto-include new files; deferred to keep this leg's churn low.)
      - name: Run platform-relevant subset (Windows — DD7 revised)
        run: |
          python -m pytest --timeout=300 --tb=short \
            tests/test_platform_paths.py tests/test_platform_shell.py \
            tests/test_platform_interpreter.py tests/test_platform_tempdirs.py \
            tests/test_pty_dispatch.py tests/test_pty_session.py tests/test_pty_windows.py \
            tests/test_filesystem_tools.py tests/test_filesystem_helpers.py \
            tests/test_filesystem_config.py \
            tests/test_config.py tests/test_config_data_dir.py \
            tests/test_execution_tools.py tests/test_execution_helpers.py \
            tests/test_execution_config.py \
            tests/test_encryption.py \
            tests/test_sandbox_factory.py tests/test_sandbox_contract.py \
            tests/test_logging_config.py

  bwrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 (ubuntu-latest) restricts unprivileged userns creation
        # via AppArmor by default. Without this, the factory's empirical
        # userns probe fails and gracefully degrades to passthrough — tools
        # then run UNCONFINED and every containment assertion in
        # `-m requires_bwrap` fails. This sysctl restores real kernel-enforced
        # bwrap on the runner.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Set up venv from the SYSTEM Python (not actions/setup-python)
        # Deliberate: setup-python's hostedtoolcache interpreter lives under
        # /opt — outside the boxed-mode minimal rootfs (/usr) — so every
        # boxed (minimal_rootfs) spawn fails at execvp. A venv created from
        # the system python3 has symlinks that resolve_python() follows back
        # into /usr, matching the deployment-shaped path (see
        # the_one/platform/interpreter.py::resolve_python).
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[all-llms,dev]"
      - name: Run @requires_bwrap sandbox tests
        run: python -m pytest -m requires_bwrap tests/ --timeout=300 --tb=short

  windows-packaged-smoke:
    # Freezes the one-dir from packaging/windows/the-one.spec, proves the DD2
    # child-spawn fix against the REAL frozen binary (the spawn-fix's only true
    # apparatus — a checkout interpreter can't exercise a PyInstaller bundle),
    # then builds + uploads the Inno installer. This is the load-bearing
    # verification of Flight 5: a red `doctor` step here is the flight's Divert
    # signal (the packaged spawn-fix regressed). Authored on a Linux host where
    # none of this can run — the observed green run lands when this PR's CI does.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash   # Git Bash on the runner — matches the `windows` job:
                      # avoids PowerShell stripping the quotes in
                      # `pip install -e ".[gui,all-llms]"` and obscuring a real
                      # install failure behind a quoting artifact.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the path-filter diff can reach the base
      # Path-filter (mirrors the `browser` job's inline git-diff): the freeze +
      # smoke is expensive (PyInstaller bundle + Inno install), so most PRs
      # (connectors/DB/MCP/agent) skip it. The filtered set is the realistic
      # blast radius for the packaged spawn-fix: packaging/** + the runtime
      # SEAM files (env/interpreter/shell/stdio/diagnostics/main/app) + the
      # smoke's own PASS-CRITERIA files (__init__.py = version asserted in
      # proof-b & installer name; config.py = the 8484 port; web/app.py = the
      # /api/info endpoint) + pyproject.toml (dep changes). MAINTENANCE NOTE: if
      # you add a NEW seam file, add it to the grep below or the smoke won't run
      # on the PR that changes it. Missing/unreachable base (first push, new
      # branch) → run everything (conservative-safe), same as `browser`.
      - name: Detect packaging-relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # no usable base → run it
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD \
               | grep -qE '^(packaging/|pyproject\.toml$|the_one/platform/env\.py$|the_one/platform/interpreter\.py$|the_one/platform/shell\.py$|the_one/mcp/transports/stdio\.py$|the_one/diagnostics\.py$|the_one/main\.py$|the_one/interfaces/app\.py$|the_one/interfaces/web/app\.py$|the_one/config\.py$|the_one/__init__\.py$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
      # The [gui] extra is REQUIRED — without pywebview→pythonnet the spec's
      # collect_* import-fails at build time. The existing `windows` job installs
      # only .[all-llms,dev] (no [gui]), so this job has its own install line.
      - name: Install GUI freeze deps + PyInstaller
        if: steps.changes.outputs.run == 'true'
        run: |
          pip install -e ".[gui,all-llms]"
          pip install pyinstaller
      # Build the frozen one-dir from the checked-in spec. `test -f` fails the
      # job fast if the bundle exe name drifts; any PyInstaller error (incl. a
      # missing pywinpty .pyd/winpty.dll — the Divert trigger) already exits
      # non-zero and fails the job.
      - name: Build frozen one-dir (PyInstaller)
        if: steps.changes.outputs.run == 'true'
        run: |
          set -eo pipefail
          pyinstaller --noconfirm packaging/windows/the-one.spec
          test -f dist/the-one/the-one.exe
      # PROOF (a) — frozen doctor. The doctor's own exit code is the gate;
      # `set -o pipefail` ensures `tee` can't mask a non-zero exit. grep both
      # `child spawn: OK` (clean_subprocess_env + PATH augmentation work on the
      # packaged binary) AND `RESULT: PASS` (also covers the frozen
      # resolve_python interpreter gate, not just child-spawn).
      - name: Packaged-smoke (a) — frozen doctor
        if: steps.changes.outputs.run == 'true'
        run: |
          set -eo pipefail
          ./dist/the-one/the-one.exe doctor | tee doctor.out
          grep -q "child spawn: OK" doctor.out
          grep -q "RESULT: PASS" doctor.out
      # PROOF (b) — frozen serve answers /api/info. Background the frozen serve
      # and poll with an httpx Python probe (NOT curl): httpx is a runtime dep
      # and is the exact path the product polls with, so there's no
      # Git-Bash-curl assumption. Assert 200 + version == the_one.__version__.
      # 30s timeout → job fails clearly rather than hanging.
      - name: Packaged-smoke (b) — frozen serve /api/info
        if: steps.changes.outputs.run == 'true'
        run: |
          set -eo pipefail
          # Background the native .exe; it is reaped via taskkill in proof (c).
          ./dist/the-one/the-one.exe serve &
          python - <<'PY'
          import time, sys, httpx, the_one
          for _ in range(30):
              try:
                  r = httpx.get("http://127.0.0.1:8484/api/info", timeout=2.0)
                  if r.status_code == 200:
                      assert r.json()["version"] == the_one.__version__, r.json()
                      sys.exit(0)
              except Exception:
                  pass
              time.sleep(1)
          sys.exit("frozen serve did not answer /api/info 200 within 30s")
          PY
      # PROOF (c) — single-instance decision input. With the frozen serve still
      # up, assert the Flight-4 probe (run from the runner's installed SOURCE,
      # not the frozen exe) sees the frozen instance as ours: it advertises an
      # our-version /api/info, so a second `app` launch's _select_port returns
      # (port, True) and starts no second server. This proves the INPUT the
      # second launch keys on; the frozen binary's own _select_port (rendered
      # second-launch) is the F9 operator HAT (DD5 — no GUI HAT this flight).
      # Teardown: `taskkill //F //IM` is Windows-native and MSYS-escaped (the
      # leading `//` keeps Git Bash from path-munging `/F`/`/IM`); `kill "$!"` on
      # a native .exe under Git Bash is unreliable. Best-effort (`|| true`) —
      # the runner is ephemeral so this is hygiene, not correctness; a teardown
      # failure must not fail the job.
      - name: Packaged-smoke (c) — single-instance probe + teardown
        if: steps.changes.outputs.run == 'true'
        run: |
          set -eo pipefail
          python -c "from the_one.interfaces.app import _select_port; p,ours=_select_port('127.0.0.1',8484); assert ours,(p,ours)"
          taskkill //F //IM the-one.exe || true
      # Inno installer build — runs AFTER the smoke so we never ship an unproven
      # build. The windows-2022 runner already ships Inno Setup >=6.3 (currently
      # 6.7.1), which supports the `x64compatible` arch token the .iss needs, so
      # we use the pre-installed compiler. We do NOT pin a version: pinning an
      # older version (e.g. 6.3.3) makes choco refuse to "downgrade" and exit 1,
      # failing the step before iscc runs. The unpinned `choco install ... || true`
      # is a tolerant ensure-present that no-ops when Inno is already installed.
      # ISCC is not guaranteed on PATH, so we locate it explicitly. The `//D`
      # double-slash is the MSYS escape for a leading `/D` — Git Bash would
      # otherwise mangle a bare `/DAppVersion` into a Windows path. Do NOT "fix"
      # it back to `/D`.
      - name: Build Inno installer
        if: steps.changes.outputs.run == 'true'
        run: |
          set -eo pipefail
          choco install innosetup -y --no-progress || true
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || ISCC="$(command -v iscc)"
          VER=$(python -c "import the_one; print(the_one.__version__)")
          "$ISCC" //DAppVersion=$VER packaging/windows/the-one.iss
          test -f "packaging/windows/Output/the-one-setup-$VER.exe"
      # Best-effort: the installer artifact is an operator-HAT convenience (the
      # comprehensive installer HAT is deferred to F9). This job's load-bearing
      # gates are the freeze build + the three packaged-smoke proofs above, which
      # already passed by this point. A transient account-wide artifact-storage
      # quota failure (recalculated every 6-12h) must not red the central-proof
      # job, so the upload is non-blocking; it still attempts and will succeed on
      # future runs once quota frees up.
      - name: Upload installer artifact
        if: steps.changes.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: the-one-windows-installer
          path: packaging/windows/Output/*.exe
