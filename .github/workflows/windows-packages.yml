name: windows-packages

# Mission 32 Flight 4 (Windows on shared metadata, and one release), DD5, DD7. Builds GleepGlorp AI
# for Windows on a hosted runner and drives the installer's behaviour on the runner's desktop
# session. Publishes nothing and reads no repository secret. Dispatch-only (plus workflow_call, the
# entry point the release workflow uses), so it never runs on a push, PR or tag:
#
#   gh workflow run windows-packages.yml --ref flight/04-windows-and-release -f mode=lifecycle [-f version=0.11.9.dev3]
#
# (GitHub offers a manual run only for a workflow file that exists on the default branch, and
# validates the dispatch inputs against that copy: a `.github/`-only stub with the same `on:` block
# lands on main first (packaging/windows/probe/windows-packages.stub.yml), and --ref then runs the
# flight branch's copy. So the `on:` block below is FROZEN for the whole flight: adding an input
# needs another stub PR. `workflow_call` has no outputs: callers find artifacts by name.)
#
# Modes:
#   probe      RETIRED after leg 1 (run 40246340174): the product .iss and spec are staged now, so
#              the probe's unstaged build recipe no longer exists. The mode exits 1 at once. The
#              probe's own files (packaging/windows/probe/) are kept as the record.
#   full       lands in leg 3b (exits 1 until then)
#   lifecycle  lands in leg 3b (exits 1 until then)
#
# Leg 3a (phase a) removed the probe's build and probe steps with the recipe they used; leg 3b
# adds the staged build (packaging/windows/build.ps1) and the lifecycle driver in their place.
#
# Cost: Windows minutes bill at 2x on a private repo; the run caps itself in layers (job timeout 60
# minutes, a timeout on every step, a concurrency group that never cancels a running build, and a
# global bound inside probe.ps1 that is below its step's timeout).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (empty: the version in the_one/__init__.py)"
        type: string
        required: false
        default: ""
      mode:
        description: "full, lifecycle or probe"
        type: choice
        options:
          - full
          - lifecycle
          - probe
        default: full
  workflow_call:
    inputs:
      version:
        description: "Version to build (empty: the version in the_one/__init__.py)"
        type: string
        required: false
        default: ""
      mode:
        description: "full, lifecycle or probe"
        type: string
        required: false
        default: full

permissions:
  contents: read

# the same shell as windows-installer.yml (Git Bash: `bash --noprofile --norc -eo pipefail {0}`);
# steps that need PowerShell say `shell: pwsh`
defaults:
  run:
    shell: bash

concurrency:
  group: windows-packages
  cancel-in-progress: false

jobs:
  build:
    # pinned, not windows-latest
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 3

      # the runner context is not available in a job-level env, so the paths are set here. The
      # paths are in forward-slash form (cygpath -m) so Git Bash, PowerShell and ISCC all take them.
      - name: Paths
        timeout-minutes: 1
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            probe) echo "mode 'probe' is retired after leg 1 (run 40246340174); the product .iss/spec are staged now"; exit 1 ;;
            full | lifecycle) echo "mode '$MODE' lands in leg 3b"; exit 1 ;;
            *) echo "unknown mode '$MODE' (full, lifecycle or probe)"; exit 1 ;;
          esac
          T="$(cygpath -m "$RUNNER_TEMP")"
          {
            echo "M32_BUILD=$T/m32-build"
            echo "M32_LOGS=$T/m32-build/logs"
            echo "M32_INSTALLERS=$T/m32-build/installers"
            echo "M32_T0=$(date +%s)"
          } >> "$GITHUB_ENV"
          mkdir -p "$T/m32-build/logs" "$T/m32-build/installers"

      - name: Runner evidence
        timeout-minutes: 2
        env:
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "== mode: $MODE"
            echo "== ImageOS=$ImageOS ImageVersion=$ImageVersion"
            echo "== ver"; cmd //c ver
            echo "== disk"; df -h /c 2>&1 | tail -2
            echo "== whoami"; whoami
          } 2>&1 | tee "$M32_LOGS/runner.txt"

      # Logs, Inno /LOG files, app logs, screenshots, doctor output, tasklist snapshots and
      # registry dumps. No installer or build output is uploaded.
      - name: Upload logs and evidence
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages-logs
          path: ${{ runner.temp }}/m32-build/logs
          retention-days: 7
          if-no-files-found: warn
